# geo-demo — VPS compose
# API :8200  Postgres :127.0.0.1:5433
# Optional crawler profile for Playwright DeepSeek (B5)

services:
  postgres:
    image: postgres:16-alpine
    container_name: geo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geo}
      POSTGRES_DB: ${POSTGRES_DB:-geo}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geo} -d ${POSTGRES_DB:-geo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: geo-api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://geo:geo@postgres:5432/geo}
      API_PORT: "8200"
      # 8200 对公网开放 → 必须设置 API_KEY，否则任何人可删数据/灌 L0/触发抓取
      API_KEY: ${API_KEY:-}
      API_COOKIE_SECURE: ${API_COOKIE_SECURE:-false}
      # 前后端分离部署（D1）：这三项与 API_COOKIE_SECURE 必须成套，
      # 缺一项的现象是「登录了但一直 401」，无报错、极难排查。见 .env.example
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      API_COOKIE_SAMESITE: ${API_COOKIE_SAMESITE:-lax}
      # 默认 false：api 镜像里没有 Playwright，真抓模式下它抢到 job 只会失败。
      # 只有确认不起 crawler profile、且 CRAWL_MODE=fake 时才置 true。
      FAKE_WORKER_ENABLED: ${FAKE_WORKER_ENABLED:-false}
      CRAWL_MODE: ${CRAWL_MODE:-fake}
      DEEPSEEK_STORAGE_STATE: ${DEEPSEEK_STORAGE_STATE:-}
      PLAYWRIGHT_HEADLESS: ${PLAYWRIGHT_HEADLESS:-true}
      SCREENSHOT_DIR: ${SCREENSHOT_DIR:-/data/screenshots}
    ports:
      - "8200:8200"
    volumes:
      - crawl_data:/data
    depends_on:
      postgres:
        condition: service_healthy

  crawler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.crawler
    container_name: geo-crawler
    restart: unless-stopped
    profiles: ["crawl"]
    # Playwright/Chromium in Docker: avoid /dev/shm crashes & zombies
    shm_size: "1gb"
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://geo:geo@postgres:5432/geo}
      CRAWL_MODE: ${CRAWL_MODE:-real}
      FAKE_WORKER_INTERVAL_SEC: ${FAKE_WORKER_INTERVAL_SEC:-3}
      FAKE_WORKER_BATCH_SIZE: ${FAKE_WORKER_BATCH_SIZE:-1}
      DEEPSEEK_STORAGE_STATE: ${DEEPSEEK_STORAGE_STATE:-/data/deepseek_storage.json}
      DEEPSEEK_USER_DATA_DIR: ${DEEPSEEK_USER_DATA_DIR:-}
      PLAYWRIGHT_HEADLESS: ${PLAYWRIGHT_HEADLESS:-true}
      CRAWL_TIMEOUT_MS: ${CRAWL_TIMEOUT_MS:-120000}
      SCREENSHOT_DIR: ${SCREENSHOT_DIR:-/data/screenshots}
    volumes:
      - crawl_data:/data
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: geo-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    profiles:
      - full

volumes:
  pgdata:
  crawl_data:
