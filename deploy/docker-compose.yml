# geo-demo — VPS / 生产向 compose
# Postgres 仅绑定 127.0.0.1，不暴露公网。
# 用法：
#   cd deploy && docker compose up -d postgres
#   docker compose ps
#   docker compose exec postgres psql -U geo -d geo -c '\dt'

services:
  postgres:
    image: postgres:16-alpine
    container_name: geo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geo}
      POSTGRES_DB: ${POSTGRES_DB:-geo}
    ports:
      # 宿主机 5433 → 容器 5432（避免与其他服务冲突；仅本机可连）
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geo} -d ${POSTGRES_DB:-geo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: geo-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    profiles:
      - full

volumes:
  pgdata:
