[project]
name = "geo-metrics"
version = "0.1.0"
description = "Explainable GEO visibility metrics (learning project)"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["geo_metrics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
